<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Login</h1>
    <form id="loginForm" autocomplete="off">
      <input id="email" type="email" placeholder="Email" autocomplete="off" required>
      <input id="password" type="password" placeholder="Password" autocomplete="off" required>
      <a class="text-link" href="forgot-password.html">Forgot Password?</a>
      <button type="submit">Login</button>
    </form>
    <p><a href="signup.html">New User - Sign Up Now</a></p>
    <p id="message"></p>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
